name: Check section citations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  section-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check-section-citations.py
